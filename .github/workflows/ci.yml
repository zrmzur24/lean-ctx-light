name: CI

# Trigger on push to main and on any PR against main.
# Skips path-irrelevant changes (docs, CHANGELOG, LICENSE) to avoid burning
# minutes on doc-only commits.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

# Cancel in-progress runs when a new commit lands on the same branch.
# Saves CI minutes when someone pushes multiple times in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use node 24 for the action runtime itself (opt-in before it becomes
# default in June 2026) to silence the actions/checkout@v4 deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test on node 22 (LTS minimum per engines.node in package.json)
        # and node 24 (current) to catch breakage on newer runtimes.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # detectRuntime smoke tests check for lean-ctx/sh availability.
        # Neither is installed on the CI runner, so they'll report
        # runtime=disabled — that's expected and the tests tolerate it
        # (see the "informational: current environment" assertion).
        run: npm test

      # Not running install.sh / doctor.sh in CI because they require Windows
      # Git Bash + PowerShell. That's explicit in the README scope.
